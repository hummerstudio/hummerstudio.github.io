# ===== 多语言文案表 =====
# 每行语言一个节点，键名必须完全一致；模板统一 `{% assign t = site.data.i18n[cur_lang] %}` 后取 t.xxx。
# nav_switch 存的是「这门语言自己的名字」：中文节点写「中文」、英文节点写「English」。
# 语言切换按钮取的是**对方**节点的 nav_switch，所以按钮上的字永远表示「点过去是哪种语言」。
# 各语言的站内地址也放在表里（home_url / about_url / …），模板就不用到处 if 判语言。

