# ===== 默认值 =====
# 顺序即优先级：先给出的先应用，后给出的覆盖前面的。所以 path:"" 这条必须放最前面。
defaults:
  # 全站默认语言：所有未显式标注的文件都算中文，模板靠 page.lang 取文案表
  - scope:
      path: ""
    values:
      lang: zh
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # 英文版文章集合
  - scope:
      path: "_posts_en"
      type: posts_en
    values:
      layout: post
      lang: en
  # 英文版参考书集合
  - scope:
      path: "_wiki_en"
      type: wiki_en
    values:
      layout: wiki
      lang: en

# ===== Collections =====
# 英文文章放独立集合而不是塞进 _posts：jekyll-paginate 只认 site.posts 且无法按语言过滤，
# 混装会让英文文章串进中文首页；独立集合同时保证 site.categories / site.tags 干净。
collections:
  wiki:
    output: true
    permalink: /wiki/:path/
  posts_en:
    output: true
    # 不写尾斜杠，与中文 permalink: /post/:title 的 URL 形态一致（英文文件不带日期前缀，:path 就是 slug）
    permalink: /en/post/:path
  wiki_en:
    output: true
    permalink: /en/wiki/:path/

# ===== Markdown =====
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: "2..3"
