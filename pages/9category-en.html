---
layout: default
title: Categories
permalink: /en/category/
lang: en
alt_url: /category/
---
{%- include i18n.html -%}
<article class="page-container">
    <div class="category-page">
        <div class="category-page-header" id="category-header">
            <!-- 由 JS 动态生成分类标题 -->
        </div>
        <div class="post-list" id="category-post-list">
            <!-- 由 JS 动态渲染 -->
        </div>
    </div>
</article>

<script type="application/json" id="nav-data">
[
  {% for section in site.data.nav %}
  {"slug": {{ section.slug | jsonify }}, "name": {{ section.name_en | jsonify }}}{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script type="application/json" id="cat-all-label">{{ t.category_all | jsonify }}</script>
<script type="application/json" id="cat-empty-label">{{ t.category_empty | jsonify }}</script>

<script type="application/json" id="posts-data">
[
  {% for post in site.posts_en %}
  {
    "title": {{ post.title | jsonify }},
    "url": {{ post.url | prepend: site.baseurl | jsonify }},
    "date": {{ post.date | date: '%Y-%m-%d' | jsonify }},
    "categories": {{ post.categories | jsonify }},
    "excerpt": {{ post.excerpt | strip_html | truncate: 200 | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script src="{{ '/static/js/category.js' | prepend: site.baseurl }}"></script>
