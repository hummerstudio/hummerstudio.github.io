---
layout: page
title: Timeline
permalink: /en/timeline/
lang: en
alt_url: /timeline/
icon: octicon-calendar
styles: archive.css
---
{%- assign en_posts = site.posts_en | sort: 'date' | reverse -%}
<section id="cd-timeline" class="cd-container">
{% for post in en_posts  %}
    <div class="cd-timeline-block" id="{{ post.date | date: '%Y-%m-%d' }}">
        <div class="cd-timeline-img cd-picture">
            <img src="{{ '/icon-picture.svg' | prepend: site.imgrepo }}" alt="Picture">
        </div>

        <div class="cd-timeline-content">
            <a href="{{ post.url | prepend: site.baseurl }}"><h4>{{ post.title }}</h4></a>
            <span class="cd-date">{{ post.date | date: '%Y-%m-%d' }}</span>
        </div>
    </div>
{% endfor %}
</section>
